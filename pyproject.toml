[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "student-manager"
version = "1.0.0"
description = "Student Management REST API (Lab01-10)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Anastasiia Brativnyk" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
    "alembic>=1.13"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "build>=1.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: integration tests",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["student_manager", "reliable_importer"]