name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        
    - name: Lint (Ruff)
      run: ruff check .
      
    - name: Format check (Ruff)
      run: ruff format --check .
      
    - name: Type check (Mypy)
      run: mypy src
      
    - name: Tests (Pytest)
      run: pytest -v
      
    - name: Build package
      run: python -m build
      
    - name: Build Docker image
      run: docker build -t student-manager:ci .